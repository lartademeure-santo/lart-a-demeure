<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L’Art à Demeure — Galerie des Artistes</title>
<style>
  :root {
    --imagen-principal: url("./fondo-index.jpeg");
    --color-papel: #E6E5E5;
    --texto-dark: #37352f;
    --texto-muted: #66635d;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #e5e5e5;
    color: var(--texto-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .lienzo-a4 {
    width: 100%;
    max-width: 750px;
    aspect-ratio: 1 / 1.4142;
    position: relative;
    overflow: hidden;
    background-image: var(--imagen-principal);
    background-size: cover;
    background-position: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  .hoja {
    position: absolute;
    z-index: 2;
    width: 75%;
    height: 85%;
    top: 7.5%;
    left: 12.5%;
    background: linear-gradient(225deg, transparent 42px, var(--color-papel) 42px);
    padding: 48px 30px 44px;
    display: flex;
    flex-direction: column;
    box-shadow:
      -1px 1px 0 rgba(255,255,255,0.6) inset,
      20px 30px 45px rgba(0,0,0,0.40),
      5px 10px 20px rgba(0,0,0,0.20);
    border-right: 1.5px solid rgba(0,0,0,0.12);
    border-bottom: 2px solid rgba(0,0,0,0.15);
    min-width: 0;
  }

  .hoja::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 42px;
    height: 42px;
    background: linear-gradient(225deg, transparent 50%, #fff 50%);
    box-shadow: -5px 5px 8px rgba(0,0,0,0.18);
    pointer-events: none;
    z-index: 5;
  }

  .contenido-scroll {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    padding: 0 6px 14px 2px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .encabezado-marca {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    margin: 0 auto 20px;
    text-align: center;
  }

  .logo-proyecto {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
  }

  .cabecera-galeria {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(0,0,0,0.13);
    padding-bottom: 12px;
  }

  .cabecera-galeria h1 {
    font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    font-size: 0.98rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #282722;
    margin-bottom: 5px;
  }

  .cabecera-galeria p {
    font-family: Baskerville, "Palatino Linotype", Georgia, serif;
    font-style: italic;
    font-size: 0.88rem;
    color: var(--texto-muted);
  }

  .galeria-artistas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
  }

  .tarjeta-artista {
    position: relative;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(145deg, #f2f1ef, #e2e0dc);
    border-top: 1.5px solid rgba(255, 255, 255, 0.95);
    border-left: 1.5px solid rgba(255, 255, 255, 0.85);
    border-right: 1.5px solid rgba(0, 0, 0, 0.16);
    border-bottom: 2px solid rgba(0, 0, 0, 0.22);
    border-radius: 6px;
    padding: 7px 7px 0 7px;
    box-shadow:
      4px 5px 10px rgba(0, 0, 0, 0.18),
      -2px -2px 6px rgba(255, 255, 255, 0.75);
    transition:
      transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1),
      box-shadow 0.14s ease,
      background 0.14s ease,
      border-color 0.14s ease;
    user-select: none;
    cursor: pointer;
  }

  .tarjeta-artista::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 5px;
    pointer-events: none;
    box-shadow: inset 0 0 0 rgba(0,0,0,0);
    transition: box-shadow 0.14s ease, background-color 0.14s ease;
    z-index: 4;
  }

  .tarjeta-artista:hover,
  .tarjeta-artista:active {
    background: linear-gradient(145deg, #d5d3ce, #e4e2de);
    border-top: 1.5px solid rgba(0, 0, 0, 0.24);
    border-left: 1.5px solid rgba(0, 0, 0, 0.20);
    border-right: 1.5px solid rgba(255, 255, 255, 0.75);
    border-bottom: 1.5px solid rgba(255, 255, 255, 0.85);
    transform: translateY(3px) scale(0.982);
    box-shadow:
      0 1px 1px rgba(255, 255, 255, 0.5),
      inset 4px 5px 10px rgba(0, 0, 0, 0.28),
      inset -3px -3px 7px rgba(255, 255, 255, 0.65);
  }

  .tarjeta-artista:hover::after,
  .tarjeta-artista:active::after {
    background-color: rgba(0, 0, 0, 0.04);
    box-shadow:
      inset 4px 5px 12px rgba(0, 0, 0, 0.30),
      inset -2px -2px 5px rgba(255, 255, 255, 0.45);
  }

  .marco-retrato {
    width: 100%;
    height: 185px;
    background: #dad7d2;
    border-radius: 3px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.18);
    overflow: hidden;
    position: relative;
  }

  .marco-retrato img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    transition: transform 0.16s ease, filter 0.16s ease;
  }

  .tarjeta-artista:hover .marco-retrato img,
  .tarjeta-artista:active .marco-retrato img {
    transform: scale(0.975);
    filter: brightness(0.93) contrast(1.03);
  }

  .info-artista {
    padding: 11px 6px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: transform 0.14s ease;
  }

  .tarjeta-artista:hover .info-artista,
  .tarjeta-artista:active .info-artista {
    transform: translateY(1px);
  }

  .info-artista strong {
    font-family: Baskerville, "Palatino Linotype", Georgia, serif;
    font-size: 0.98rem;
    font-weight: 400;
    color: #26251f;
    letter-spacing: 0.25px;
  }

  .info-artista span {
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--texto-muted);
  }

  .pie-catalogo {
    margin-top: 22px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--texto-muted);
    letter-spacing: 0.6px;
  }

  @media (max-width: 600px) {
    body {
      display: block;
      padding: 8px;
      min-height: 100vh;
    }

    .lienzo-a4 {
      width: 100%;
      min-height: calc(100vh - 16px);
      height: calc(100vh - 16px);
      aspect-ratio: auto;
    }

    .hoja {
      width: 88%;
      left: 6%;
      height: 90%;
      top: 5%;
      padding: 40px 18px 32px;
    }

    .encabezado-marca {
      margin-bottom: 14px;
    }

    .cabecera-galeria h1 {
      font-size: 0.9rem;
    }

    .galeria-artistas {
      gap: 13px;
    }

    .tarjeta-artista {
      padding: 5px 5px 0 5px;
    }

    .marco-retrato {
      height: 148px;
    }

    .info-artista {
      padding: 9px 4px 10px;
    }

    .info-artista strong {
      font-size: 0.9rem;
    }

    .info-artista span {
      font-size: 0.64rem;
    }
  }

  @media (max-width: 360px) {
    .hoja {
      padding-left: 14px;
      padding-right: 14px;
    }
    .galeria-artistas {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body ontouchstart="">

<div class="lienzo-a4">
  <section class="hoja">
    <div class="contenido-scroll">

      <div class="encabezado-marca">
        <img src="./assets/logo.png" alt="L’Art à Demeure" class="logo-proyecto">
      </div>

      <div class="cabecera-galeria">
        <h1>Galerie des Artistes</h1>
        <p>Collection privée — Sélection d’œuvres et biographies</p>
      </div>

      <div class="galeria-artistas">

        <a href="./artistes/rene-charles-bellanger/index.html" class="tarjeta-artista">
          <div class="marco-retrato">
            <img src="./assets/retrato/bellanger-rene-charles.jpg" alt="René Charles Bellanger">
          </div>
          <div class="info-artista">
            <strong>René Charles Bellanger</strong>
            <span>1895–1964</span>
          </div>
        </a>

        <a href="./artistes/jean-louis-appian/index.html" class="tarjeta-artista">
          <div class="marco-retrato">
            <img src="./assets/retrato/jean-louis-appian.jpg" alt="Jean-Louis Appian">
          </div>
          <div class="info-artista">
            <strong>Jean-Louis Appian</strong>
            <span>1862–1896</span>
          </div>
        </a>

        <a href="./artistes/jean-michel-deny/index.html" class="tarjeta-artista">
          <div class="marco-retrato">
            <img src="./assets/retrato/jean-michel-deny.jpg" alt="Jean-Michel Deny">
          </div>
          <div class="info-artista">
            <strong>Jean-Michel Deny</strong>
            <span>Né en 1950</span>
          </div>
        </a>

        <a href="./artistes/louis-latapie/index.html" class="tarjeta-artista">
          <div class="marco-retrato">
            <img src="./assets/retrato/louis-latapie.jpg" alt="Louis Latapie">
          </div>
          <div class="info-artista">
            <strong>Louis Latapie</strong>
            <span>1891–1972</span>
          </div>
        </a>

        <a href="./artistes/roger-crusat/index.html" class="tarjeta-artista">
          <div class="marco-retrato">
            <img src="./assets/retrato/roger-crusat.jpg" alt="Roger Crusat">
          </div>
          <div class="info-artista">
            <strong>Roger Crusat</strong>
            <span>1917–1994</span>
          </div>
        </a>

      </div>

      <div class="pie-catalogo">
        Sélectionnez un artiste pour consulter sa biographie et ses œuvres
      </div>

    </div>
  </section>
</div>

</body>
</html>

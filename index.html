<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L’Art à Demeure — Galerie des Artistes</title>

<style>
  :root {
    --imagen-principal: url("./fondo-index.jpeg");
    --color-papel: #E6E5E5;
    --texto-dark: #37352f;
    --texto-muted: #66635d;
    --borde: #d8d6d2;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #e5e5e5;
    color: var(--texto-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .lienzo-a4 {
    width: 100%;
    max-width: 750px;
    aspect-ratio: 1 / 1.4142;
    position: relative;
    overflow: hidden;
    background-image: var(--imagen-principal);
    background-size: cover;
    background-position: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  .hoja {
    position: absolute;
    z-index: 2;
    width: 75%;
    height: 85%;
    top: 7.5%;
    left: 12.5%;
    background: linear-gradient(225deg, transparent 42px, var(--color-papel) 42px);
    padding: 48px 30px 44px;
    display: flex;
    flex-direction: column;
    box-shadow:
      -1px 1px 0 rgba(255,255,255,0.6) inset,
      20px 30px 45px rgba(0,0,0,0.40),
      5px 10px 20px rgba(0,0,0,0.20);
    border-right: 1.5px solid rgba(0,0,0,0.12);
    border-bottom: 2px solid rgba(0,0,0,0.15);
    min-width: 0;
  }

  .hoja::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 42px;
    height: 42px;
    background: linear-gradient(225deg, transparent 50%, #fff 50%);
    box-shadow: -5px 5px 8px rgba(0,0,0,0.18);
    pointer-events: none;
    z-index: 5;
  }

  .contenido-scroll {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    padding: 0 5px 12px 0;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .encabezado-marca {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    margin: 0 auto 22px;
    text-align: center;
  }

  .logo-proyecto {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
  }

  .cabecera-galeria {
    text-align: center;
    margin-bottom: 22px;
    border-bottom: 1px solid rgba(0,0,0,0.13);
    padding-bottom: 14px;
  }

  .cabecera-galeria h1 {
    font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    font-size: 0.98rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #282722;
    margin-bottom: 5px;
  }

  .cabecera-galeria p {
    font-family: Baskerville, "Palatino Linotype", Georgia, serif;
    font-style: italic;
    font-size: 0.88rem;
    color: var(--texto-muted);
  }

  /* Cuadrícula de artistas */
  .galeria-artistas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
  }

  /* Tarjeta con relieve inicial sutil y efecto hundido al interactuar */
  .tarjeta-artista {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: #ecebea;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 2px 5px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.85);
    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      background-color 0.18s ease,
      border-color 0.18s ease;
    user-select: none;
  }

  /* Efecto de relieve hundido (Cursor en PC y toque en móvil) */
  .tarjeta-artista:hover,
  .tarjeta-artista:active,
  .tarjeta-artista.tocado {
    background: #dcdad7;
    border-color: rgba(0,0,0,0.16);
    transform: translateY(2px) scale(0.988);
    box-shadow:
      inset 3px 4px 9px rgba(0,0,0,0.22),
      inset -2px -2px 6px rgba(255,255,255,0.55),
      0 1px 1px rgba(255,255,255,0.4);
  }

  .marco-retrato {
    width: 100%;
    height: 170px;
    background: #f4f3f1;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
    transition: background-color 0.18s ease;
  }

  .tarjeta-artista:hover .marco-retrato,
  .tarjeta-artista:active .marco-retrato,
  .tarjeta-artista.tocado .marco-retrato {
    background: #e6e4e1;
  }

  .marco-retrato svg,
  .marco-retrato img {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 145px;
    max-height: 145px;
    object-fit: contain;
    transition: transform 0.2s ease;
  }

  .tarjeta-artista:hover .marco-retrato svg,
  .tarjeta-artista:active .marco-retrato svg,
  .tarjeta-artista.tocado .marco-retrato svg {
    transform: scale(0.97);
  }

  .info-artista {
    padding: 12px 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .info-artista strong {
    font-family: Baskerville, "Palatino Linotype", Georgia, serif;
    font-size: 1.02rem;
    font-weight: 400;
    color: #26251f;
    letter-spacing: 0.3px;
  }

  .info-artista span {
    font-size: 0.72rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--texto-muted);
  }

  .pie-catalogo {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--texto-muted);
    letter-spacing: 0.6px;
  }

  @media (max-width: 600px) {
    body {
      display: block;
      padding: 8px;
      min-height: 100vh;
    }

    .lienzo-a4 {
      width: 100%;
      min-height: calc(100vh - 16px);
      height: calc(100vh - 16px);
      aspect-ratio: auto;
    }

    .hoja {
      width: 88%;
      left: 6%;
      height: 90%;
      top: 5%;
      padding: 40px 18px 32px;
    }

    .encabezado-marca {
      margin-bottom: 14px;
    }

    .cabecera-galeria h1 {
      font-size: 0.9rem;
    }

    .galeria-artistas {
      gap: 12px;
    }

    .marco-retrato {
      height: 138px;
      padding: 8px;
    }

    .info-artista {
      padding: 9px 6px;
    }

    .info-artista strong {
      font-size: 0.92rem;
    }

    .info-artista span {
      font-size: 0.65rem;
    }
  }

  @media (max-width: 360px) {
    .hoja {
      padding-left: 14px;
      padding-right: 14px;
    }
    .galeria-artistas {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
